version: 2

models:
  - name: fct_orders
    description: >
      Факт заказов: одна строка — один заказ. Тестовые заказы исключены.
      К заказу пристыкованы итоги по платежам; подтверждённая покупка — статус paid
      и хотя бы одна успешная оплата (возврат оплатой не считается).
    columns:
      - name: order_id
        description: "Номер заказа."
        data_tests: [unique, not_null]
      - name: customer_id
        description: "Клиент, оформивший заказ."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: order_date
        description: "Дата заказа."
      - name: ordered_at
        description: "Время оформления заказа."
      - name: order_status
        description: "Статус заказа: paid, pending, returned, cancelled."
      - name: order_amount
        data_tests:
          - non_negative
        description: "Сумма заказа в рублях после скидок."
      - name: paid_amount
        description: "Сумма успешных оплат без возвратов; 0, если оплат нет."
      - name: refunded_amount
        description: "Сумма возвратов положительным числом; 0, если возвратов нет."
      - name: net_paid_amount
        description: "Оплачено минус возвращено."
      - name: successful_payments_count
        description: "Число успешных оплат без возвратов."
      - name: first_paid_at
        description: "Время первой успешной оплаты; пусто, если оплат нет."
      - name: is_confirmed
        description: "Подтверждённая покупка: статус paid и хотя бы одна успешная оплата."
        data_tests: [not_null]
      - name: items_count
        description: "Число разных товаров в одном заказе."
        data_tests:
          - not_null
          - non_negative
          
  - name: fct_order_items
    description: "Позиции заказов: одна строка — один товар в заказе."
    columns:
      - name: order_item_id
        description: "Уникальный ключ позиции заказа."
        data_tests: [unique, not_null]
      - name: order_id
        description: "Заказ, к которому относится позиция."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fct_orders')
                field: order_id
      - name: product_id
        description: "Товар в позиции заказа."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_products')
                field: product_id
      - name: customer_id
        description: "Клиент, оформивший заказ."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: order_date
        description: "Дата оформления заказа."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_dates')
                field: date_day
      - name: quantity
        description: "Количество единиц товара в позиции."
        data_tests: [non_negative]
      - name: unit_price
        description: "Цена одной единицы товара."
        data_tests: [non_negative]
      - name: discount_amount
        description: "Скидка на позицию."
        data_tests: [non_negative]
      - name: line_amount
        description: "Сумма позиции после скидки."
        data_tests: [non_negative]
      - name: is_confirmed
        description: "{{ doc('confirmed_order') }}"

  - name: dim_customers
    description: "Клиенты магазина, включая тех, кто ещё не совершал подтверждённых покупок."
    columns:
      - name: customer_id
        description: "Уникальный идентификатор клиента."
        data_tests: [unique, not_null]
      - name: registered_at
        description: "Дата и время регистрации клиента."
      - name: registration_date
        description: "Дата регистрации клиента."
      - name: city
        description: "Город клиента."
      - name: acquisition_channel
        description: "Канал привлечения клиента."
      - name: first_confirmed_order_id
        description: "Номер первой подтверждённой покупки."
      - name: first_confirmed_at
        description: "Дата и время первой подтверждённой покупки."
      - name: confirmed_orders_count
        description: "Количество подтверждённых покупок клиента."
        data_tests: [non_negative]
      - name: confirmed_revenue
        description: "Сумма подтверждённых покупок клиента."
        data_tests: [non_negative]
      - name: is_buyer
        description: "Признак того, что у клиента есть подтверждённая покупка."

  - name: dim_products
    description: "Товары магазина с брендами и полной иерархией категорий."
    columns:
      - name: product_id
        description: "Уникальный идентификатор товара."
        data_tests: [unique, not_null]
      - name: product_name
        description: "Название товара."
      - name: brand
        description: "Бренд товара."
      - name: category_name
        description: "Категория товара."
      - name: parent_category_name
        description: "Родительская категория товара."
      - name: root_category_name
        description: "Корневая категория верхнего уровня: Electronics или Home."

  - name: dim_dates
    description: "Календарь с датами, которые встречаются в заказах."
    columns:
      - name: date_day
        description: "Календарная дата."
        data_tests: [unique, not_null]
      - name: year
        description: "Год."
      - name: quarter
        description: "Номер квартала."
      - name: month
        description: "Номер месяца."
      - name: day
        description: "День месяца."
      - name: day_of_week
        description: "Номер дня недели: от 1 для понедельника до 7 для воскресенья."
      - name: is_weekend
        description: "Признак выходного дня."